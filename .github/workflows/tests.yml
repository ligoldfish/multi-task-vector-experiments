name: CPU tests and source integrity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify experiment sources
        run: python tools/verify_sources.py
      - name: Install CPU framework and dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Test experiment and vector analysis
        run: python -B -m pytest tests -q
      - name: Test export, restore and model interventions
        run: python -B -m unittest discover -s portable -p 'test_*.py' -v
      - name: Verify sources remain unchanged
        run: python tools/verify_sources.py
