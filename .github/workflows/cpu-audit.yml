name: CPU artifact and portability checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen scientific sources
        run: python tools/verify_sources.py
      - name: Install CPU tool dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy>=1.10,<2' 'PyYAML>=6,<7' 'filelock>=3.12,<4'
      - name: Test independent vector analysis and import
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test portable export and minimal injection
        working-directory: portable
        run: python -B -m unittest -v test_portable_export test_use_task_vector
