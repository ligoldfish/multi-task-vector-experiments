[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-task-vector"
version = "0.1.0"
description = "Auditable LTV and LoDA-MT experiments on Ascend ModelMate"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "PyYAML>=6,<7", "transformers==4.51.3", "datasets==3.6.0", "sacrebleu==2.5.1", "rouge-score==0.1.2", "sentence-transformers>=3,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
task-vector = "task_vector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

